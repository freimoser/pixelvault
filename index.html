<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixelvault</title>
<meta name="description" content="Private Bildergalerie: eigene Bilder als URL oder Markdown kopieren und in Metabase & anderen Tools einbinden.">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-96.png" sizes="96x96" type="image/png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Die Bildliste kommt von api.github.com (per fetch, daher crossorigin), die
     Großansicht von raw.githubusercontent.com. Die Verbindung vorab aufzubauen
     spart laut Lighthouse rund 300 ms. -->
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<!-- Keine Schrift vom Google-Fonts-Server: Das übertrug bei jedem Aufruf die
     IP-Adresse ohne Einwilligung an Google. Die Schriftliste nimmt Inter, wenn
     lokal installiert, sonst die Systemschrift. -->
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1 class="brand-name">pixelvault</h1>
      </a>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="Bilder durchsuchen" aria-label="Bilder nach Dateiname durchsuchen" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <span class="count" id="stats" aria-live="polite">lädt …</span>
    </div>
  </header>

  <main>
    <p class="intro">Eigene Bilder für Metabase &amp; Co. <b>URL</b> oder <b>MD</b> kopieren und einfügen. Mit <kbd>/</kbd> suchen, <kbd>Enter</kbd> kopiert die URL des ersten Treffers.</p>
    <section id="grid" class="grid" aria-label="Bilder"></section>
    <p id="empty" class="empty" hidden>Keine Bilder gefunden.</p>
    <p id="error" class="error" hidden></p>
  </main>

  <footer class="site-footer">
    <span>Neues Bild: in <code>images/</code> legen, committen, pushen.</span>
    <nav>
      <a href="https://github.com/freimoser/pixelvault" rel="noopener">GitHub</a>
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-name">
    <div class="lb-panel">
      <img id="lightbox-img" alt="">
      <div class="lb-bar">
        <div class="lb-meta">
          <span id="lb-name" class="name"></span>
          <span id="lb-size" class="size"></span>
        </div>
        <button id="lb-url" class="act" type="button">URL kopieren</button>
        <button id="lb-md" class="act" type="button">MD kopieren</button>
        <button id="lightbox-close" class="icon-btn" type="button" aria-label="Schließen">&times;</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js?v=dev"></script>
</body>
</html>
