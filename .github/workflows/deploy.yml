name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo default is read-only, which is why the auto-generated Pages build
# failed on OIDC. Request exactly what deploy-pages needs, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Bricht den Deploy ab, bevor ein schon einmal gemachter Fehler live geht:
      # externe Google-Schrift, fehlendes noindex, fehlende Rechtstexte,
      # abgeschaltetes Favicon, wirkungslose robots.txt, alter GitHub-Name.
      - name: Livegang-Prüfung
        run: ./scripts/check.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
