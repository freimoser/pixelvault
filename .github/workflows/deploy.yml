name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo default is read-only, which is why the auto-generated Pages build
# failed on OIDC. Request exactly what deploy-pages needs, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Bricht den Deploy ab, bevor ein schon einmal gemachter Fehler live geht:
      # externe Google-Schrift, fehlendes noindex, fehlende Rechtstexte,
      # abgeschaltetes Favicon, wirkungslose robots.txt, alter GitHub-Name.
      - name: Livegang-Prüfung
        run: ./scripts/check.sh
      # Kleine WebP-Vorschauen für die Galerie, nur im Artefakt, nie im Repo.
      # Die Originale unter images/ bleiben unverändert — ihre raw-Adressen
      # stecken in Metabase und dürfen sich nie ändern.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vorschaubilder erzeugen
        run: |
          python -m pip install --quiet pillow
          python scripts/thumbs.py
      # GitHub Pages lässt Browser HTML, CSS und JS zehn Minuten zwischen-
      # speichern. Ohne Versionsangabe bekommt ein wiederkehrender Besucher
      # nach einem Deploy neues HTML mit altem CSS. Die Commit-Kennung im
      # Dateiverweis hält zusammengehörige Versionen zusammen.
      - name: Cache-Versionen setzen
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" *.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
